<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Duck Swamp">
<title>Duck Swamp Escape</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: players bar on top, the whole board scaled to fit in the middle, roll controls along the bottom. */
:root {
  --water: #1B7894;
  --water-deep: #12596F;
  --sand: #FFF3CF;
  --sand-edge: #E5CF8E;
  --cream: #F4E6B8;
  --ink: #14301F;
  --sun: #FFE9A8;
  --coral: #E4572E;
  --font-display: 'Fredoka', 'Arial Rounded MT Bold', ui-rounded, 'Helvetica Neue', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--water);
  color: var(--sand);
  font-family: var(--font-display);
  font-size: 18px;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* Players bar */
#bar { background: var(--water-deep); margin: 0 -16px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top, 0px)); border-radius: 0 0 22px 22px; }
#chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 8px; border-radius: 40px;
  background: rgba(255, 243, 207, .14); color: var(--sand);
  border: 3px solid transparent; min-width: 0;
}
.chip .cd { width: 36px; height: 32px; flex: none; position: relative; }
.chip .cd i {
  position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--ink); color: var(--sand); font-style: normal; font-size: 12px; font-weight: 700;
  display: grid; place-items: center; line-height: 1;
}
.chip b { display: block; font-size: 20px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.chip small { display: block; font-size: 15px; font-weight: 500; line-height: 1.1; opacity: .92; white-space: nowrap; }
.chip.active { background: var(--sun); color: var(--ink); border-color: #fff; }
.chip.active b { font-weight: 700; }

/* Board */
#boardWrap { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1780px; height: 920px; transform-origin: 0 0; }
#stage .abs { position: absolute; }
.tile {
  position: absolute; width: 90px; height: 90px; border-radius: 24px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
}
.tile svg { position: absolute; left: 0; top: 0; }
.tile span {
  position: relative; display: block; font-weight: 700; font-size: 38px; color: var(--ink); line-height: 1;
}
.isl { position: absolute; }
.gator { position: absolute; }
.label {
  position: absolute; box-sizing: border-box; padding: 8px 10px; border-radius: 16px;
  background: var(--sand); border: 3px solid var(--ink); color: var(--ink);
  display: flex; flex-direction: column; gap: 2px; width: 140px;
}
.label b { font-weight: 700; line-height: 1; }
.label small { font-size: 16px; font-weight: 600; line-height: 1.1; color: #26361F; }

.token {
  position: absolute; width: var(--s); height: var(--s); z-index: 5;
  transform: translate(-50%, -50%);
  transition: left .26s ease, top .26s ease, width .2s ease, height .2s ease;
}
.token .body { width: 100%; height: 100%; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .35)); }
.token .badge {
  position: absolute; right: -4%; bottom: -6%; width: 44%; height: 44%; border-radius: 50%;
  background: var(--ink); color: var(--sand); font-weight: 700; font-size: calc(var(--s) * .27);
  display: grid; place-items: center; line-height: 1; border: 2px solid var(--sand); box-sizing: border-box;
}
.token.active { z-index: 8; }
.token.active::before {
  content: ""; position: absolute; left: -22%; top: -22%; right: -22%; bottom: -22%; border-radius: 50%;
  border: 5px solid #fff; animation: pulse 1.2s ease-in-out infinite;
}
.token .body.hop { animation: hop .26s ease-out; }
@keyframes hop { 0% { transform: translateY(0); } 45% { transform: translateY(-20px) scale(1.12); } 100% { transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .35; transform: scale(1.12); } }

/* Controls */
#controls {
  background: var(--water-deep); margin: 0 -16px; padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  border-radius: 22px 22px 0 0;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
#turn { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0; }
#turnDuck { width: 58px; height: 52px; flex: none; }
#status { font-size: 24px; font-weight: 600; line-height: 1.15; min-width: 0; }
#die {
  width: 92px; height: 92px; flex: none; background: #fff; border: 5px solid var(--ink); border-radius: 22px;
  box-sizing: border-box; padding: 10px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 2px;
}
#die i { border-radius: 50%; background: transparent; }
#die i.on { background: var(--ink); }
#die.rolling { animation: wob .16s linear infinite; }
@keyframes wob { 0% { transform: rotate(-9deg); } 50% { transform: rotate(9deg) translateY(-4px); } 100% { transform: rotate(-9deg); } }
#roll {
  min-width: 220px; height: 76px; border-radius: 38px; border: 5px solid var(--ink);
  background: var(--sun); color: var(--ink); font-size: 34px; font-weight: 700; letter-spacing: 1px;
  box-shadow: 0 6px 0 var(--ink);
}
#roll:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
#roll:disabled { opacity: .45; cursor: default; box-shadow: 0 6px 0 var(--ink); }
.tools { display: flex; gap: 10px; flex: 1 1 260px; justify-content: flex-end; }
.tbtn {
  min-height: 56px; padding: 0 20px; border-radius: 28px; border: 3px solid var(--sand);
  background: transparent; color: var(--sand); font-size: 20px; font-weight: 600;
}
.tbtn[aria-pressed="false"] { opacity: .75; text-decoration: line-through; }

/* Overlays */
.overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
  background: rgba(8, 38, 50, .78); overflow-y: auto;
}
.card {
  width: min(540px, 100%); box-sizing: border-box; border-radius: 30px; border: 6px solid var(--sand);
  padding: 26px 28px 28px; text-align: center; color: var(--ink); background: var(--cream);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .4); animation: pop .28s ease-out;
}
@keyframes pop { 0% { transform: scale(.7) rotate(-4deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.card[data-tone="fwd"] { background: #7ED16A; }
.card[data-tone="back"] { background: #F7D654; }
.card[data-tone="jail"] { background: #B7C0C9; }
.card[data-tone="gator"] { background: #E8806F; }
.card[data-tone="sand"] { background: #C9A15C; }
.card[data-tone="win"] { background: var(--sun); }
.card h2 { margin: 0; font-size: 46px; line-height: 1.05; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; font-size: 26px; font-weight: 500; line-height: 1.25; text-wrap: balance; }
.cardIcon { height: 110px; display: grid; place-items: center; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.bigbtn {
  min-height: 64px; padding: 0 30px; border-radius: 32px; border: 4px solid var(--ink);
  background: var(--ink); color: var(--sand); font-size: 28px; font-weight: 700;
}
.bigbtn.alt { background: transparent; color: var(--ink); }

#setup .card { background: var(--cream); gap: 14px; }
#setup h1 { margin: 0; font-size: 56px; line-height: 1; font-weight: 700; text-wrap: balance; }
#setup .sub { font-size: 24px; font-weight: 600; margin: 0; }
#counts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cnt {
  width: 64px; height: 64px; border-radius: 20px; border: 4px solid var(--ink); background: transparent;
  color: var(--ink); font-size: 30px; font-weight: 700;
}
.cnt[aria-pressed="true"] { background: var(--ink); color: var(--sand); }
#names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.nrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nrow .nd { width: 46px; height: 42px; flex: none; position: relative; }
.nrow .nd i {
  position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--ink); color: var(--sand); font-style: normal; font-size: 13px; font-weight: 700;
  display: grid; place-items: center; line-height: 1;
}
.nrow input {
  flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 16px; border: 3px solid var(--ink);
  background: #fff; color: var(--ink); font-family: inherit; font-size: 22px; font-weight: 600; padding: 0 12px;
  -webkit-user-select: text; user-select: text;
}

#confetti { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 60; overflow: hidden; }
#confetti i { position: absolute; top: -20px; width: 12px; height: 18px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 700px) {
  #names { grid-template-columns: minmax(0, 1fr); }
  #setup h1 { font-size: 40px; }
  .card h2 { font-size: 36px; }
  .card p { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .token .body.hop, .token.active::before, #die.rolling, .card { animation: none; }
  .token { transition: none; }
  #confetti { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="bar"><div id="chips" role="list" aria-label="Players"></div></header>
  <main id="boardWrap"><div id="stage" aria-label="Game board"></div></main>
  <footer id="controls">
    <div id="turn"><div id="turnDuck"></div><div id="status" role="status" aria-live="polite"></div></div>
    <div id="die" role="img" aria-label="Die"></div>
    <button id="roll" type="button">ROLL</button>
    <div class="tools">
      <button id="sound" class="tbtn" type="button" aria-pressed="true">Sound</button>
      <button id="menu" class="tbtn" type="button">New game</button>
    </div>
  </footer>
</div>

<div id="setup" class="overlay">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h1 id="setupTitle">Duck Swamp Escape</h1>
    <p class="sub">How many ducks are playing?</p>
    <div id="counts" role="group" aria-label="Number of players"></div>
    <div id="names"></div>
    <div class="btns"><button id="start" class="bigbtn" type="button">Start game</button></div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="cardIcon" id="mIcon"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="btns" id="mBtns"></div>
  </div>
</div>
<div id="confetti" aria-hidden="true"></div>

<script>
window.addEventListener('error', function (e) {
  try {
    var b = document.getElementById('errbar');
    if (!b) {
      b = document.createElement('div'); b.id = 'errbar';
      b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#B3261E;color:#fff;font:600 16px/1.3 system-ui,sans-serif;padding:10px 16px';
      document.body.appendChild(b);
    }
    b.textContent = 'Something went wrong: ' + (e.message || 'error') + (e.lineno ? ' (line ' + e.lineno + ')' : '');
  } catch (x) {}
});
(function () {
  'use strict';
  var W = 1780, H = 920, R = 110;
  var COLORS = ['#F2C230', '#F28C28', '#D64545', '#E87DB0', '#8F5BC9', '#3D7EDB', '#F7F7F2'];
  var TILE_FILLS = ['#F26B6B', '#F6A04D', '#F7D654', '#7ED16A', '#6FB6F0', '#B89BEF'];
  var QS = [7, 15, 24, 33, 41, 46];
  var BOAT = 51;

  var INK = '#14301F';
  var $ = function (id) { return document.getElementById(id); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- artwork ---------- */
  function duckSVG(c) {
    return '<svg viewBox="0 0 72 64" width="100%" height="100%" aria-hidden="true">' +
      '<path d="M10 40 C10 28 22 26 34 28 C44 30 52 36 52 44 C52 54 40 58 28 58 C16 58 10 50 10 40 Z" fill="' + c + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="46" cy="22" r="12" fill="' + c + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<path d="M56 20 L68 24 L56 29 Z" fill="#F28C28" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<circle cx="49" cy="19" r="2.6" fill="' + INK + '"/>' +
      '<path d="M18 42 C24 36 34 38 36 46 C30 50 22 50 18 42 Z" fill="#fff" fill-opacity=".45"/></svg>';
  }
  var PALM = '<path d="M104 68 C100 52 106 36 100 22" fill="none" stroke="#8A5A2B" stroke-width="7" stroke-linecap="round"/>' +
    '<path d="M100 22 C82 8 62 14 52 28 C74 22 88 24 100 22 Z" fill="#2E8B3A" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<path d="M100 22 C118 8 138 14 148 28 C126 22 112 24 100 22 Z" fill="#2E8B3A" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<path d="M100 22 C90 4 108 -2 116 10 C108 12 104 16 100 22 Z" fill="#2E8B3A" stroke="' + INK + '" stroke-width="2.5"/>';
  var BASE = '<ellipse cx="100" cy="74" rx="94" ry="24" fill="#F1DFA2" stroke="' + INK + '" stroke-width="3"/>' +
    '<ellipse cx="100" cy="68" rx="76" ry="17" fill="#6CC24A" stroke="' + INK + '" stroke-width="3"/>';
  var ISL = {
    palm: BASE + PALM,
    twin: BASE + '<g transform="translate(-34 14) scale(0.8)">' + PALM + '</g><g transform="translate(40 8) scale(0.9)">' + PALM + '</g>',
    rock: BASE +
      '<ellipse cx="72" cy="60" rx="22" ry="14" fill="#9AA6B2" stroke="' + INK + '" stroke-width="3"/>' +
      '<ellipse cx="100" cy="54" rx="26" ry="18" fill="#B7C0C9" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="136" cy="60" r="14" fill="#3E9E3E" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="132" cy="56" r="3.5" fill="#F7A6C0"/><circle cx="141" cy="62" r="3.5" fill="#FFE9A8"/>'
  };
  function island(kind, x, cy, w) {
    var h = Math.round(w * 106 / 200);
    return '<div class="isl" style="left:' + x + 'px;top:' + (cy - Math.round(h / 2)) + 'px;width:' + w + 'px;height:' + h + 'px">' +
      '<svg viewBox="0 -6 200 106" width="100%" height="100%" aria-hidden="true">' + ISL[kind] + '</svg></div>';
  }
  var GATOR = '<svg viewBox="0 0 160 56" width="100%" height="100%" aria-hidden="true">' +
    '<ellipse cx="80" cy="47" rx="74" ry="6" fill="none" stroke="#BFE8F2" stroke-width="3" stroke-opacity=".7"/>' +
    '<path d="M6 38 L30 33 C42 26 60 24 80 26 C110 28 130 32 156 30 C132 40 112 46 80 46 C60 48 40 46 30 44 Z" fill="#2B5E27" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M12 38 L15 43 L18 38 M21 37 L24 42 L27 36" fill="#fff" stroke="' + INK + '" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<circle cx="44" cy="25" r="5.5" fill="#FFF3CF" stroke="' + INK + '" stroke-width="2.5"/><circle cx="45" cy="25" r="2.2" fill="' + INK + '"/>' +
    '<circle cx="64" cy="25" r="3" fill="#3F8B39" stroke="' + INK + '" stroke-width="2"/>' +
    '<circle cx="82" cy="26" r="3" fill="#3F8B39" stroke="' + INK + '" stroke-width="2"/>' +
    '<circle cx="100" cy="28" r="3" fill="#3F8B39" stroke="' + INK + '" stroke-width="2"/></svg>';
  function gator(x, y, w, flip) {
    var h = Math.round(w * 56 / 160);
    return '<div class="gator" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px' + (flip ? ';transform:scaleX(-1)' : '') + '">' + GATOR + '</div>';
  }
  var SAND_SVG = '<svg viewBox="0 0 82 82" width="82" height="82" aria-hidden="true">' +
    '<path d="M41 41 a4 4 0 0 1 8 0 a8 8 0 0 1 -16 0 a12 12 0 0 1 24 0 a16 16 0 0 1 -32 0 a20 20 0 0 1 40 0 a24 24 0 0 1 -48 0 a28 28 0 0 1 56 0" fill="none" stroke="#7A5522" stroke-width="3.5" stroke-linecap="round"/>' +
    '<circle cx="41" cy="41" r="19" fill="#FFF3CF" stroke="#7A5522" stroke-width="3"/></svg>';
  var BOAT_SVG = '<svg viewBox="0 0 220 150" width="150" height="102" role="img" aria-label="Escape boat">' +
    '<path d="M10 92 L210 92 L184 134 C180 140 174 142 168 142 L52 142 C46 142 40 140 36 134 Z" fill="#E4572E" stroke="' + INK + '" stroke-width="4"/>' +
    '<rect x="10" y="86" width="200" height="12" rx="4" fill="#FFE9A8" stroke="' + INK + '" stroke-width="3"/>' +
    '<rect x="106" y="14" width="7" height="76" fill="' + INK + '"/>' +
    '<path d="M114 16 L114 80 L172 80 Z" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M104 24 L104 80 L56 80 Z" fill="#FFE9A8" stroke="' + INK + '" stroke-width="3"/>' +
    '<path d="M113 14 L134 20 L113 26 Z" fill="#D64545" stroke="' + INK + '" stroke-width="2"/>' +
    '<circle cx="64" cy="116" r="8" fill="#FFE9A8" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="110" cy="116" r="8" fill="#FFE9A8" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="156" cy="116" r="8" fill="#FFE9A8" stroke="' + INK + '" stroke-width="3"/></svg>';

  function iconFor(type) {
    var s = 'stroke="' + INK + '" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"';
    if (type === 'fwd') return '<svg viewBox="0 0 120 100" width="130" height="108" aria-hidden="true"><path d="M20 20 L56 50 L20 80" ' + s + '/><path d="M60 20 L96 50 L60 80" ' + s + '/></svg>';
    if (type === 'back') return '<svg viewBox="0 0 120 100" width="130" height="108" aria-hidden="true"><path d="M100 20 L64 50 L100 80" ' + s + '/><path d="M60 20 L24 50 L60 80" ' + s + '/></svg>';
    if (type === 'jail') return '<svg viewBox="0 0 140 100" width="150" height="108" aria-hidden="true"><rect x="10" y="8" width="120" height="84" rx="8" fill="#4A5560" stroke="' + INK + '" stroke-width="5"/>' +
      [30, 54, 78, 102].map(function (x) { return '<rect x="' + (x - 4) + '" y="8" width="8" height="84" fill="#E3E8EE"/>'; }).join('') + '</svg>';
    if (type === 'gator') return '<div style="width:190px;height:66px">' + GATOR + '</div>';
    if (type === 'sand') return SAND_SVG.replace('width="82" height="82"', 'width="110" height="110"');
    if (type === 'win') return '<div style="width:210px;height:143px">' + BOAT_SVG.replace('width="150" height="102"', 'width="100%" height="100%"') + '</div>';
    return '';
  }

  /* ---------- board geometry ---------- */
  var segs = [
    { t: 'line', x0: 330, y0: 115, x1: 1450, y1: 115, len: 1120 },
    { t: 'arc', cx: 1450, cy: 225, dir: 1, a0: -Math.PI / 2, len: Math.PI * R },
    { t: 'line', x0: 1450, y0: 335, x1: 330, y1: 335, len: 1120 },
    { t: 'arc', cx: 330, cy: 445, dir: -1, a0: -Math.PI / 2, len: Math.PI * R },
    { t: 'line', x0: 330, y0: 555, x1: 1450, y1: 555, len: 1120 },
    { t: 'arc', cx: 1450, cy: 665, dir: 1, a0: -Math.PI / 2, len: Math.PI * R },
    { t: 'line', x0: 1450, y0: 775, x1: 330, y1: 775, len: 1120 }
  ];
  var total = 0;
  segs.forEach(function (s) { total += s.len; });
  var step = total / 50;
  function where(d) {
    var rest = d;
    for (var k = 0; k < segs.length; k++) {
      var s = segs[k];
      if (rest <= s.len) {
        if (s.t === 'line') {
          var f = rest / s.len;
          return { x: s.x0 + (s.x1 - s.x0) * f, y: s.y0 + (s.y1 - s.y0) * f, ang: 0 };
        }
        var th = s.a0 + s.dir * (rest / R);
        var tx = s.dir === 1 ? -Math.sin(th) : Math.sin(th);
        var ty = s.dir === 1 ? Math.cos(th) : -Math.cos(th);
        return { x: s.cx + R * Math.cos(th), y: s.cy + R * Math.sin(th), ang: Math.atan2(ty, tx) * 180 / Math.PI };
      }
